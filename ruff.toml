target-version = "py311"
line-length = 120
extend-exclude = [".references", ".venv"]

[lint]
# pyflakes, pycodestyle, bugbear, and bandit security rules
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",  # long lines: handled by review, not CI
    "B008",  # FastAPI's Depends() in defaults is the intended pattern
    "S603",  # subprocess with a fixed argv (dev tooling only)
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108"]  # asserts and fake credentials in tests
"staging/test_*.py" = ["S101", "S105", "S106"]
