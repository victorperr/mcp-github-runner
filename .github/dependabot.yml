version: 2

# Monthly and grouped, to keep the number of PRs (and branches) low:
# - one PR per ecosystem for minor and patch updates, safe to merge when CI is green;
# - one separate PR per ecosystem for major updates, which can break things and
#   are handled on purpose (e.g. the fastmcp >= 3.2 upgrade, release gate G1).
# Security updates for known vulnerabilities are not affected by this schedule.
updates:
  # Keeps the SHA-pinned actions current (the tag comment is updated too).
  - package-ecosystem: github-actions
    directories: ["/", "/action", "/template"]
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  # requirements-dev.txt (root) and the gateway image's locked requirements.
  - package-ecosystem: pip
    directories: ["/", "/gateway"]
    schedule:
      interval: monthly
    groups:
      python:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  # The template's uv.lock.
  - package-ecosystem: uv
    directory: "/template"
    schedule:
      interval: monthly
    groups:
      template:
        update-types: [minor, patch]
      template-major:
        update-types: [major]

  # The gateway's base image.
  - package-ecosystem: docker
    directory: "/gateway"
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
