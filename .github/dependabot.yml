version: 2
updates:
  # Keeps the SHA-pinned actions current (the tag comment is updated too).
  - package-ecosystem: github-actions
    directories: ["/", "/action", "/template"]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: ["/", "/gateway"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/gateway"
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: "/template"
    schedule:
      interval: weekly
