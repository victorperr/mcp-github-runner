name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Python lint and security rules
        run: ruff check .
      - name: GitHub Actions security audit
        run: zizmor --offline --config zizmor.yml .github/workflows action/action.yml template/.github/workflows

  test:
    name: Tests (${{ matrix.suite }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        suite: [action, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Run suite with coverage gate
        working-directory: ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = "action" ]; then cov=mcp_runner; min=85; else cov=app; min=90; fi
          python -m pytest -q --cov="$cov" --cov-report=term-missing --cov-fail-under="$min"

  image:
    name: Gateway image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t mcp-gateway:ci gateway
      - name: Start with a production-like config
        # Dummy App credentials: the gateway only uses them when it talks to GitHub.
        run: |
          docker run -d --name gw -p 8000:8000 \
            -e GATEWAY_PUBLIC_URL=https://gw.example.com \
            -e GITHUB_APP_ID=1 -e GITHUB_APP_PRIVATE_KEY=not-used-by-the-smoke-test \
            mcp-gateway:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && exit 0; sleep 1; done
          exit 1
      - name: Smoke test
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(docker exec gw id -u)" = 10001                                # not root
          docker exec gw test -s /data/gateway.db                              # volume writable
          test "$(code http://localhost:8000/openapi.json)" = 404             # docs off outside dev mode
          test "$(code -X POST http://localhost:8000/s/me/demo/mcp)" = 401    # MCP endpoint needs a token
          test "$(code -X PUT http://localhost:8000/runner/manifest)" = 401   # runner API needs OIDC
      - name: Gateway logs
        if: always()
        run: docker logs gw

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Audit the template's locked dependencies
        working-directory: template
        # Ignored, reviewed 2026-11-03 (see docs/testing.md, "Known vulnerabilities"):
        #   PYSEC-2026-2475  fastmcp `install` command on Windows: not used
        #   PYSEC-2026-2476  fastmcp OAuthProxy + GitHub provider: not used
        #   PYSEC-2026-2447  diskcache pickle, needs write access to the cache dir: use ephemeral runners
        # Remove these when moving to fastmcp >= 3.2.
        run: |
          uv export --frozen --no-dev --format requirements-txt -o "$RUNNER_TEMP/template-req.txt" > /dev/null
          pip-audit -r "$RUNNER_TEMP/template-req.txt" --require-hashes --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2026-2475 --ignore-vuln PYSEC-2026-2476 --ignore-vuln PYSEC-2026-2447
      - name: Audit the gateway image's locked dependencies
        run: pip-audit -r gateway/requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: Audit dev dependencies
        run: |
          pip-audit -r requirements-dev.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-2475 --ignore-vuln PYSEC-2026-2476 --ignore-vuln PYSEC-2026-2447
