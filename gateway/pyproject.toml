[project]
name = "mcp-github-runner-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "fastmcp>=2.12,<3", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../action"]
testpaths = ["tests"]
