# Dev-only metadata for testing the runner. The Action itself runs mcp_runner
# from PYTHONPATH inside the user's project environment.
[project]
name = "mcp-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.12,<3", "httpx"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
